<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site input review</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#183340;background:#f2f5f5}body{margin:0}header{padding:20px 28px;background:#173e4a;color:white}h1{margin:4px 0;font-size:25px}button,select,input,textarea{font:inherit;padding:8px;border:1px solid #91a7ae;border-radius:4px}button{cursor:pointer;background:#e0eff0}main{padding:20px;display:grid;grid-template-columns:minmax(340px,1.2fr) minmax(340px,1fr);gap:20px}.card{background:white;padding:18px;border-radius:8px;box-shadow:0 2px 8px #0001}#map{width:100%;background:#e8eeee;border:1px solid #c6d3d7}#profile{width:100%;height:210px}polyline,circle{cursor:pointer}.selected{stroke:#ffae00!important;stroke-width:5!important}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:260px;overflow:auto}textarea{display:block;width:94%;height:70px;margin:10px 0}label{display:block;margin:10px 0}#items{width:100%}.muted{color:#50676e;font-size:13px}.badge{background:#fff2ca;padding:8px;color:#694b00}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}#gaps{max-height:260px;overflow:auto;font-size:13px}#status{color:#8c360a}svg text{font-size:13px;pointer-events:none}a{color:#17617b}@media(max-width:850px){main{grid-template-columns:1fr}}
#left[aria-pressed="true"],#right[aria-pressed="true"]{background:#17617b;color:#fff;border-color:#103f50;box-shadow:inset 0 0 0 2px #fff}
button:focus-visible{outline:3px solid #d77700;outline-offset:3px}
button:disabled{opacity:.55;cursor:default}
</style>__INTERFACE_STYLE__
<body class="sr-map">
<a class="sr-skip" href="#workspace-main"><span lang="en">Skip to workspace</span><span lang="zh-CN">跳至工作区</span></a>
<header><button id="language" style="float:right">简体中文</button><h1 id="heading">Site input review</h1><div id="project"></div></header>
<main id="workspace-main" tabindex="-1"><section class="card"><div class="badge" id="scope"></div><p class="muted" id="legend"></p><svg id="map" viewBox="0 0 700 700" role="img" aria-label="Candidate geometry map"></svg><p id="mapnote" class="muted"></p><details><summary id="gapheading"></summary><ul id="gaps"></ul></details></section>
<section class="card"><label id="chooseLabel" for="items"></label><select id="items"></select><pre id="evidence"></pre><svg id="profile" viewBox="0 0 650 210" role="img" aria-label="Sampled section"></svg><p id="bankhelp" class="muted"></p><div class="actions"><button id="left"></button><button id="right"></button><button id="clear"></button></div><div id="banks"></div><label id="decisionLabel" for="decision"></label><select id="decision"></select><label id="candidateLabel" for="candidate"></label><select id="candidate"></select><label id="noteLabel" for="note"></label><textarea id="note"></textarea><label id="reviewerLabel" for="reviewer"></label><input id="reviewer"><label id="basisLabel" for="basis"></label><textarea id="basis"></textarea><div class="actions"><button id="export"></button><button id="import"></button><input type="file" id="file" accept=".json" hidden></div><p id="status" role="status"></p><p class="muted" id="instructions"></p></section></main>
<div class="actions" style="margin:0 28px"><button id="restoreDraft"></button><button id="discardDraft"></button></div><p id="draftStatus" class="muted" style="margin:0 28px 16px" role="status"></p>
<p id="fileHelp" class="muted" style="margin:0 28px 20px" role="note"></p>
<script id="payload" type="application/json">__REVIEW_DATA__</script>
<script>
const {packet,spec}=JSON.parse(document.getElementById('payload').textContent);
const el=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';
let lang='en',current=0,bankMode=null;
const all=[...packet.map.features,...packet.fields];
const words={en:{heading:'Site input review',scope:'Review candidates · No model authorization · Engineering acceptance NOT_ASSESSED',legend:'Teal: flowline candidates · Purple: sections · Red: location marker. Click a map feature to inspect its source.',gapheading:'Missing inputs and review items',chooseLabel:'Map feature or source parameter',decisionLabel:'Disposition',candidateLabel:'Source candidate (explicit selection required)',noteLabel:'Reason / evidence interpretation',reviewerLabel:'Reviewer',basisLabel:'Review basis and scope',export:'Export decisions JSON',import:'Load saved decisions',left:'Select left bank',right:'Select right bank',clear:'Clear banks',bankhelp:'Select a bank button, then click an interior point on the section. Banks remain terrain-based candidates.',instructions:'Changes stay in this page until exported. Run site-review-import with the original packet and exported JSON. Original files and model settings are unchanged.',mapnote:'Actual terrain elevation backdrop where available; no inundation or buried geometry. Grid north is up.',empty:'No geometry available. Import reviewed source data or alignment candidates.',pending:'PENDING',retain:'RETAIN_CANDIDATE',reject:'REJECT',defer:'DEFER'},cn:{heading:'场地输入审核',scope:'候选资料审核 · 不授予模型许可 · 工程接受 NOT_ASSESSED',legend:'青色：流路候选 · 紫色：断面 · 红色：位置标记。点击地图要素查看来源。',gapheading:'缺失输入及待审核项',chooseLabel:'地图要素或来源参数',decisionLabel:'审核决定',candidateLabel:'来源候选（必须明确选择）',noteLabel:'理由 / 证据解释',reviewerLabel:'审核人',basisLabel:'审核依据及范围',export:'导出决定 JSON',import:'载入已保存决定',left:'选择左岸',right:'选择右岸',clear:'清除岸线选择',bankhelp:'先选左岸或右岸按钮，再点击断面的内部采样点。岸线仍为地形候选。',instructions:'页面修改需导出才能保存。用原始审核包和导出 JSON 运行 site-review-import。原始文件和模型配置保持不变。',mapnote:'有资料时显示真实地形高程背景；不表示淹没或埋藏结构。网格北朝上。',empty:'暂无几何。请导入来源资料或流路候选。',pending:'待处理',retain:'保留候选',reject:'拒绝',defer:'暂缓'}};
words.en.fileHelp='To reopen an exported decisions JSON, use Load saved decisions on this page and select the file. To read its text, open it from VS Code or Notepad. Double-clicking it in File Explorer is not needed to restore decisions.';
words.cn.fileHelp='继续审核时，请在本页点击“载入已保存决定”并选择导出的 JSON。查看文本可在 VS Code 或记事本内打开文件。恢复决定无需在资源管理器中双击 JSON。';
Object.assign(words.en,{bankIdle:'Bank selection is off.',bankLeft:'Selecting the left bank. Click the highlighted button again to cancel.',bankRight:'Selecting the right bank. Click the highlighted button again to cancel.'});
Object.assign(words.cn,{bankIdle:'当前未开启岸线选择。',bankLeft:'当前正在选择左岸。再次点击高亮按钮可取消。',bankRight:'当前正在选择右岸。再次点击高亮按钮可取消。'});
function updateBankMode(){const available=all[current]?.kind==='section';if(!available)bankMode=null;['left','right'].forEach((id,i)=>{el(id).disabled=!available;el(id).setAttribute('aria-pressed',String(bankMode===i));});el('clear').disabled=!available;const w=words[lang];el('bankhelp').textContent=w.bankhelp+' '+(bankMode===null?w.bankIdle:bankMode===0?w.bankLeft:w.bankRight);}
function toggleBankMode(mode){if(all[current]?.kind!=='section')return;bankMode=bankMode===mode?null:mode;updateBankMode();}
function selectFeature(index){saveCurrent();if(index!==current)bankMode=null;current=index;el('items').selectedIndex=index;render();}
function svg(tag,attrs,parent){let v=document.createElementNS(ns,tag);for(const [k,x]of Object.entries(attrs))v.setAttribute(k,x);parent.append(v);return v}
function updateLanguage(){const w=words[lang];for(const [k,v]of Object.entries(w))if(el(k))el(k).textContent=v;el('language').textContent=lang==='en'?'简体中文':'English';document.documentElement.lang=lang==='en'?'en':'zh-CN';el('mapnote').textContent+=' '+(packet.map.crs_label||'')+' | '+(packet.vertical_datum||'Datum unknown / 基准未知')+' | '+(packet.created_utc||'');const saved=el('decision').value;el('decision').replaceChildren();['PENDING','RETAIN_CANDIDATE','REJECT','DEFER'].forEach((v,i)=>el('decision').add(new Option(w[['pending','retain','reject','defer'][i]],v)));el('decision').value=saved||'PENDING';render();}
function map(){const m=packet.map,s=el('map');s.replaceChildren();if(!m.bounds)return;const [x0,y0,x1,y1]=m.bounds;const point=p=>[(p[0]-x0)/(x1-x0)*700,700-(p[1]-y0)/(y1-y0)*700];if(m.background)svg('image',{href:'data:image/png;base64,'+m.background,x:0,y:0,width:700,height:700},s);for(const f of m.features){let shape=f.xy.length===1?svg('circle',{cx:point(f.xy[0])[0],cy:point(f.xy[0])[1],r:7,fill:'#d23233'},s):svg('polyline',{points:f.xy.map(point).map(p=>p.join(',')).join(' '),fill:'none',stroke:f.kind==='section'?'#af3176':'#008495','stroke-width':f.kind==='section'?2:3},s);shape.dataset.feature=f.id;if(all[current]?.id===f.id)shape.classList.add('selected');shape.addEventListener('click',()=>selectFeature(all.findIndex(x=>x.id===f.id)));let p=point(f.xy[0]);svg('text',{x:p[0]+6,y:p[1]-5,fill:'#14242c'},s).textContent=f.label;}svg('text',{x:660,y:30},s).textContent='N ↑';let metres=(x1-x0)*m.unit_to_m/5;svg('line',{x1:30,y1:670,x2:170,y2:670,stroke:'#111','stroke-width':4},s);svg('text',{x:30,y:655},s).textContent=metres.toFixed(1)+' m';}
function saveCurrent(){if(!all.length)return;const d=spec.decisions[current];d.decision=el('decision').value;d.note=el('note').value||null;d.candidate_index=el('candidate').value===''?null:Number(el('candidate').value);if(d.decision!=='RETAIN_CANDIDATE'){d.bank_indices=null;d.candidate_index=null;}}
function render(){updateBankMode();map();let f=all[current];if(!f){el('evidence').textContent=words[lang].empty;return;}const d=spec.decisions[current];el('evidence').textContent=JSON.stringify(f.data||f,null,2);el('decision').value=d.decision;el('note').value=d.note||'';el('candidate').replaceChildren(new Option('—',''));(f.candidates||[]).forEach((v,i)=>el('candidate').add(new Option(i+': '+JSON.stringify(v),i)));el('candidate').value=d.candidate_index===null?'':d.candidate_index;el('candidate').disabled=!f.candidates;const chart=el('profile');chart.replaceChildren();for(const id of ['left','right','clear'])el(id).disabled=f.kind!=='section';el('banks').textContent='Bank indices: '+JSON.stringify(d.bank_indices);if(f.kind!=='section')return;let xs=f.data.station_ft,z=f.data.elevation_ft;let low=Math.min(...z),high=Math.max(...z),range=Math.max(high-low,1);const p=(x,y)=>[30+(x-xs[0])/(xs.at(-1)-xs[0])*590,175-(y-low)/range*140];svg('polyline',{points:xs.map((x,i)=>p(x,z[i]).join(',')).join(' '),fill:'none',stroke:'#665039','stroke-width':2},chart);svg('text',{x:30,y:200},chart).textContent='Station / elevation: international ft';xs.forEach((x,i)=>{let [cx,cy]=p(x,z[i]);let mark=svg('circle',{cx,cy,r:d.bank_indices?.includes(i)?6:3,fill:d.bank_indices?.includes(i)?'#d77700':'#007b95'},chart);svg('title',{},mark).textContent=i+': '+x.toFixed(3)+' / '+z[i].toFixed(3);mark.addEventListener('click',()=>{if(bankMode===null||i===0||i===xs.length-1)return;saveCurrent();if(!d.bank_indices)d.bank_indices=[null,null];d.bank_indices[bankMode]=i;d.decision='RETAIN_CANDIDATE';render();changed();});});}
all.forEach(f=>el('items').add(new Option(f.label,f.id)));el('project').textContent=packet.title+' · '+packet.project_id;packet.gaps.forEach(g=>{const li=document.createElement('li');li.textContent=JSON.stringify(g);el('gaps').append(li)});
el('items').onchange=()=>selectFeature(el('items').selectedIndex);el('language').onclick=()=>{saveCurrent();lang=lang==='en'?'cn':'en';updateLanguage()};el('left').onclick=()=>toggleBankMode(0);el('right').onclick=()=>toggleBankMode(1);el('clear').onclick=()=>{saveCurrent();bankMode=null;spec.decisions[current].bank_indices=null;render();changed()};
el('export').onclick=()=>{saveCurrent();spec.reviewer=el('reviewer').value||null;spec.review_basis=el('basis').value||null;const blob=new Blob([JSON.stringify(spec,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=packet.project_id+'_review_decisions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);el('status').textContent=lang==='en'?'Download requested. After saving, reopen with Load saved decisions on this page. Command-line import validation is still required.':'已请求下载。保存后可在本页用“载入已保存决定”重新载入，仍需命令行导入校验。'};
el('import').onclick=()=>el('file').click();el('file').onchange=async()=>{try{const loaded=JSON.parse(await el('file').files[0].text());if(JSON.stringify(loaded.packet)!==JSON.stringify(spec.packet)||loaded.schema_version!==spec.schema_version||loaded.decisions.length!==spec.decisions.length||loaded.decisions.some((v,i)=>v.id!==spec.decisions[i].id))throw Error('Different review snapshot');spec.decisions=loaded.decisions;el('reviewer').value=loaded.reviewer||'';el('basis').value=loaded.review_basis||'';bankMode=null;render();el('status').textContent='Loaded / 已载入';}catch(e){el('status').textContent=String(e)}};
updateLanguage();
__REVIEW_STATE__
updateLanguage();
refreshDraftLanguage();
</script></body></html>
