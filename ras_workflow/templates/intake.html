<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Complete project inputs | SteadyReach</title><link rel="stylesheet" href="intake.css"><script defer src="geometry_setup.js"></script><script defer src="geometry_review.js"></script><script defer src="intake_native.js"></script><script defer src="intake.js"></script></head>
<body><header><div><span class="brand">SteadyReach</span><h1 id="title">Complete project inputs</h1><p id="subtitle">Your progress is saved locally. Calculation waits for your decision.</p></div><button id="language" type="button">简体中文</button></header>
<div class="layout"><aside><div id="project"></div><nav id="steps" aria-label="Steps"></nav><div class="status"><span id="badge">WAITING_FOR_INPUT</span><p id="saved" role="status" aria-live="polite"></p></div></aside>
<main><div id="notice" role="alert" hidden></div><div id="screen"></div><footer><button id="back" type="button">Back</button><div><button id="save" type="button">Save draft</button><button id="next" class="primary" type="button">Next</button></div></footer></main></div>
<dialog id="cancelDialog"><h2 id="cancelTitle"></h2><p id="cancelExplain"></p><label id="cancelNameLabel" for="cancelName"></label><input id="cancelName" autocomplete="name"><label id="cancelReasonLabel" for="cancelReason"></label><textarea id="cancelReason" rows="3"></textarea><label class="check"><input id="cancelConfirm" type="checkbox"><span id="cancelConsent"></span></label><div id="cancelError" class="field-error" role="alert"></div><div class="actions"><button id="pauseInstead" type="button"></button><button id="keepWorking" type="button"></button><button id="confirmCancel" type="button" class="danger"></button></div></dialog>
</body></html>
